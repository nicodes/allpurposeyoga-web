          - blockquote [ref=e58]: “So grateful that All Purpose exists! Such a special studio that is heart-led and so inviting. The space is full of beautiful light, and adorned with plants and alter items. I felt right at home when I arrived and loved my vinyasa class with Jade. Highly recommend checking out Boulder’s newest yoga studio!”
