        - heading "About Us" [level=2] [ref=e42]
        - paragraph [ref=e43]: We are a small locally operated and female owned yoga studio. Our mission at All Purpose Yoga is to enhance the world we live in, from commitment to personal practice to the ways we are then able to give back to society. At All Purpose Yoga we strive to encourage agency in our own bodies and minds to navigate with a sense of responsibility and ownership to the power we possess to make an impact with our time here.
        - paragraph [ref=e44]: Our vision is to make regular strides toward self-discovery alongside the community. Embracing individuality, authenticity and diverse teaching modalities, All Purpose Yoga serves as a platform for life long learners and social change agents.
        - link "View Our Class Schedule" [ref=e45] [cursor=pointer]:
          - /url: /schedule/
